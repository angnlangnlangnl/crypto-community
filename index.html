<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>币圈社区</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #ededed;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #ededed;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #d9d9d9;
            flex-shrink: 0;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .back-btn {
            font-size: 20px;
            cursor: pointer;
            color: #333;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 20px;
            cursor: pointer;
            color: #333;
        }
        
        .connect-banner {
            background: #f7f7f7;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        
        .connect-banner .avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #f7931a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .connect-banner .info {
            flex: 1;
            min-width: 0;
        }
        
        .connect-banner .name {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }
        
        .connect-banner .status {
            font-size: 11px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .connect-btn {
            padding: 6px 12px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        
        .connect-btn:disabled {
            background: #ccc;
            cursor: default;
        }
        
        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #ededed;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }
        
        .time-divider {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin: 5px 0;
        }
        
        .msg-wrapper {
            display: flex;
            gap: 10px;
            max-width: 75%;
            animation: msgIn 0.3s ease;
        }
        
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .msg-wrapper.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .msg-wrapper.other {
            align-self: flex-start;
        }
        
        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 13px;
        }
        
        .msg-wrapper.own .msg-avatar {
            background: #07c160;
        }
        
        .msg-wrapper.other .msg-avatar {
            background: #f7931a;
        }
        
        .msg-body {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }
        
        .msg-sender {
            font-size: 11px;
            color: #999;
        }
        
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            word-break: break-word;
        }
        
        .msg-wrapper.own .msg-bubble {
            background: #95ec69;
            color: #333;
            border-top-right-radius: 2px;
        }
        
        .msg-wrapper.other .msg-bubble {
            background: white;
            color: #333;
            border-top-left-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        
        .msg-time {
            font-size: 10px;
            color: #bbb;
            align-self: flex-end;
        }
        
        .system-msg {
            align-self: center;
            background: #dadada;
            padding: 7px 15px;
            border-radius: 5px;
            font-size: 13px;
            color: #666;
            text-align: center;
            max-width: 90%;
        }
        
        .empty-state {
            text-align: center;
            color: #ccc;
            margin-top: 40px;
        }
        
        .empty-state .icon {
            font-size: 50px;
            margin-bottom: 12px;
        }
        
        .empty-state p {
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        /* ========== 微信底部输入栏 ========== */
        .input-area {
            background: #f7f7f7;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
        
        .icon-btn {
            cursor: pointer;
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background 0.2s;
            background: none;
            border: none;
            padding: 0;
        }
        
        .icon-btn:hover {
            background: #e0e0e0;
        }
        
        .icon-btn svg {
            display: block;
        }
        
        .input-field {
            flex: 1;
            padding: 10px 14px;
            background: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            color: #333;
            min-width: 0;
        }
        
        .input-field::placeholder {
            color: #bbb;
        }
        
        .send-btn {
            padding: 8px 16px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
            white-space: nowrap;
            display: none;
            font-weight: 500;
        }
        
        .send-btn.show {
            display: block;
        }
        
        .send-btn:active {
            background: #06ad56;
        }
        
        .messages::-webkit-scrollbar {
            width: 4px;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 2px;
        }
        
        @media (min-width: 768px) {
            body {
                max-width: 800px;
                margin: 0 auto;
                box-shadow: 0 0 30px rgba(0,0,0,0.1);
            }
            .msg-wrapper {
                max-width: 65%;
            }
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <div class="header">
        <div class="header-left">
            <span class="back-btn">‹</span>
            <span class="chat-title">🚀 币圈社区</span>
        </div>
        <div class="header-right">
            <span id="onlineCount">👥 0</span>
            <span>⋯</span>
        </div>
    </div>
    
    <!-- 连接提示条 -->
    <div class="connect-banner" id="connectBanner">
        <div class="avatar">🦊</div>
        <div class="info">
            <div class="name">MetaMask 钱包</div>
            <div class="status" id="walletStatus">未连接</div>
        </div>
        <button class="connect-btn" id="connectBtn" onclick="connectWallet()">连接</button>
    </div>
    
    <!-- 消息区域 -->
    <div class="messages" id="messages">
        <div class="time-divider" id="timeDivider"></div>
        <div class="empty-state" id="emptyState">
            <div class="icon">💬</div>
            <p>暂无消息</p>
            <p>连接钱包后开始聊天</p>
        </div>
    </div>
    
    <!-- 底部输入栏 - 微信布局 -->
    <div class="input-area">
        <!-- 语音按钮 - SVG图标 -->
        <button class="icon-btn" onclick="toggleVoiceMode()" id="voiceBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10V12C5 15.866 8.134 19 12 19C15.866 19 19 15.866 19 12V10"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
        </button>
        
        <!-- 输入框 -->
        <input type="text" class="input-field" id="msgInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendMessage()">
        
        <!-- 表情按钮 -->
        <button class="icon-btn" onclick="showEmojiPanel()">😊</button>
        
        <!-- 加号按钮 -->
        <button class="icon-btn" onclick="showMorePanel()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </button>
        
        <!-- 发送按钮 - 有内容时显示 -->
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
    </div>

    <script>
        let isConnected = false;
        let userAddress = '';
        let messageCount = 0;
        let isVoiceMode = false;
        
        function setTime() {
            const now = new Date();
            document.getElementById('timeDivider').textContent = now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
        }
        setTime();
        setInterval(setTime, 30000);
        
        function updateOnlineCount() {
            const count = 100 + Math.floor(Math.random() * 900);
            document.getElementById('onlineCount').textContent = '👥 ' + count;
        }
        updateOnlineCount();
        setInterval(updateOnlineCount, 5000);
        
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    userAddress = accounts[0];
                    isConnected = true;
                    
                    document.getElementById('walletStatus').textContent = '✅ ' + userAddress.slice(0, 8) + '...' + userAddress.slice(-6);
                    document.getElementById('walletStatus').style.color = '#07c160';
                    document.getElementById('connectBtn').textContent = '已连接';
                    document.getElementById('connectBtn').style.background = '#ccc';
                    document.getElementById('connectBtn').disabled = true;
                    
                    if (messageCount === 0) {
                        const emptyState = document.getElementById('emptyState');
                        if (emptyState) emptyState.style.display = 'none';
                        addSystemMessage('🎉 欢迎来到币圈社区！');
                    }
                } catch (error) {
                    alert('连接失败：' + error.message);
                }
            } else {
                alert('请安装MetaMask钱包');
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            
            addOwnMessage(text, userAddress || '我');
            input.value = '';
            updateSendBtn();
            
            setTimeout(() => {
                const replies = ['收到！👍', '同意', '有道理', '关注一下', '好项目！', '学习了', '支持！', '已关注'];
                addOtherMessage(replies[Math.floor(Math.random() * replies.length)], '币圈助手');
            }, 800 + Math.random() * 2000);
        }
        
        function addOwnMessage(text, sender) {
            messageCount++;
            const messages = document.getElementById('messages');
            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.style.display = 'none';
            
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper own';
            wrapper.innerHTML = `
                <div class="msg-avatar">我</div>
                <div class="msg-body">
                    <span class="msg-sender">${sender}</span>
                    <div class="msg-bubble">${text}</div>
                    <span class="msg-time">${getTime()}</span>
                </div>
            `;
            messages.appendChild(wrapper);
            scrollToBottom();
        }
        
        function addOtherMessage(text, sender) {
            messageCount++;
            const messages = document.getElementById('messages');
            
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper other';
            wrapper.innerHTML = `
                <div class="msg-avatar">助</div>
                <div class="msg-body">
                    <span class="msg-sender">${sender}</span>
                    <div class="msg-bubble">${text}</div>
                    <span class="msg-time">${getTime()}</span>
                </div>
            `;
            messages.appendChild(wrapper);
            scrollToBottom();
        }
        
        function addSystemMessage(text) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'system-msg';
            div.textContent = text;
            messages.appendChild(div);
            scrollToBottom();
        }
        
        function getTime() {
            return new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
        }
        
        function scrollToBottom() {
            const messages = document.getElementById('messages');
            messages.scrollTop = messages.scrollHeight;
        }
        
        function updateSendBtn() {
            const input = document.getElementById('msgInput');
            const sendBtn = document.getElementById('sendBtn');
            if (input.value.trim()) {
                sendBtn.classList.add('show');
            } else {
                sendBtn.classList.remove('show');
            }
        }
        
        document.getElementById('msgInput').addEventListener('input', updateSendBtn);
        
        function toggleVoiceMode() {
            const input = document.getElementById('msgInput');
            const voiceBtn = document.getElementById('voiceBtn');
            isVoiceMode = !isVoiceMode;
            
            if (isVoiceMode) {
                input.placeholder = '按住说话';
                input.readOnly = true;
                input.style.background = '#e8e8e8';
                input.style.textAlign = 'center';
                voiceBtn.innerHTML = `
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="6" width="20" height="12" rx="2"/>
                        <line x1="6" y1="12" x2="6" y2="12"/>
                        <line x1="10" y1="12" x2="14" y2="12"/>
                        <line x1="18" y1="12" x2="18" y2="12"/>
                    </svg>
                `;
            } else {
                input.placeholder = '输入消息...';
                input.readOnly = false;
                input.style.background = 'white';
                input.style.textAlign = 'left';
                voiceBtn.innerHTML = `
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="2" width="6" height="12" rx="3"/>
                        <path d="M5 10V12C5 15.866 8.134 19 12 19C15.866 19 19 15.866 19 12V10"/>
                        <line x1="12" y1="19" x2="12" y2="22"/>
                    </svg>
                `;
            }
        }
        
        function showEmojiPanel() {
            alert('表情面板功能开发中');
        }
        
        function showMorePanel() {
            alert('更多功能开发中');
        }
    </script>
</body>
</html>
