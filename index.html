<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>币圈社区</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #ededed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 手机壳 */
        .phone {
            width: 400px;
            height: 780px;
            background: #f5f5f5;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 8px solid #1a1a1a;
        }
        
        /* 状态栏 */
        .status-bar {
            background: #ededed;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #333;
        }
        
        /* 头部 */
        .header {
            background: #ededed;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #d9d9d9;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .back-btn {
            font-size: 20px;
            cursor: pointer;
            color: #333;
        }
        
        .chat-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }
        
        .header-right {
            font-size: 20px;
            cursor: pointer;
            color: #333;
        }
        
        /* 连接提示 */
        .connect-banner {
            background: #f7f7f7;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .connect-banner .avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #f7931a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .connect-banner .info {
            flex: 1;
        }
        
        .connect-banner .name {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }
        
        .connect-banner .status {
            font-size: 12px;
            color: #999;
        }
        
        .connect-btn {
            padding: 8px 16px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        
        /* 消息区域 */
        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #ededed;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* 时间分隔 */
        .time-divider {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin: 10px 0;
        }
        
        /* 消息气泡 */
        .msg-wrapper {
            display: flex;
            gap: 10px;
            max-width: 80%;
        }
        
        .msg-wrapper.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .msg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 14px;
        }
        
        .msg-wrapper.own .msg-avatar {
            background: #07c160;
        }
        
        .msg-wrapper.other .msg-avatar {
            background: #f7931a;
        }
        
        .msg-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .msg-sender {
            font-size: 12px;
            color: #999;
        }
        
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }
        
        .msg-wrapper.own .msg-bubble {
            background: #95ec69;
            color: #333;
            border-top-right-radius: 2px;
        }
        
        .msg-wrapper.other .msg-bubble {
            background: white;
            color: #333;
            border-top-left-radius: 2px;
        }
        
        .msg-time {
            font-size: 11px;
            color: #999;
            align-self: flex-end;
        }
        
        /* 输入区域 */
        .input-area {
            background: #f7f7f7;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #e0e0e0;
        }
        
        .voice-btn, .emoji-btn, .add-btn {
            font-size: 24px;
            cursor: pointer;
            color: #666;
            flex-shrink: 0;
        }
        
        .input-field {
            flex: 1;
            padding: 10px 15px;
            background: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            color: #333;
        }
        
        .input-field::placeholder {
            color: #bbb;
        }
        
        .send-btn {
            padding: 8px 16px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            color: #ccc;
            margin-top: 60px;
        }
        
        .empty-state .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .empty-state p {
            font-size: 14px;
        }
        
        /* 滚动条 */
        .messages::-webkit-scrollbar {
            width: 4px;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="phone">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋 100%</span>
        </div>
        
        <!-- 头部 -->
        <div class="header">
            <div class="header-left">
                <span class="back-btn">‹</span>
                <span class="chat-title">🚀 币圈社区</span>
            </div>
            <span class="header-right">⋯</span>
        </div>
        
        <!-- 连接提示 -->
        <div class="connect-banner" id="connectBanner">
            <div class="avatar">🦊</div>
            <div class="info">
                <div class="name">MetaMask</div>
                <div class="status" id="walletStatus">未连接</div>
            </div>
            <button class="connect-btn" id="connectBtn" onclick="connectWallet()">连接</button>
        </div>
        
        <!-- 消息区域 -->
        <div class="messages" id="messages">
            <div class="time-divider" id="timeDivider"></div>
            <div class="empty-state" id="emptyState">
                <div class="icon">💬</div>
                <p>暂无消息</p>
                <p>连接钱包后开始聊天</p>
            </div>
        </div>
        
        <!-- 输入区域 -->
        <div class="input-area">
            <span class="voice-btn">🎤</span>
            <input type="text" class="input-field" id="msgInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendMessage()">
            <span class="emoji-btn">😊</span>
            <span class="add-btn">➕</span>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>发送</button>
        </div>
    </div>

    <script>
        let isConnected = false;
        let userAddress = '';
        let messageCount = 0;
        
        // 设置时间
        function setTime() {
            const now = new Date();
            const h = now.getHours().toString().padStart(2, '0');
            const m = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.status-bar span:first-child').textContent = h + ':' + m;
            document.getElementById('timeDivider').textContent = now.toLocaleDateString('zh-CN') + ' ' + h + ':' + m;
        }
        setTime();
        setInterval(setTime, 30000);
        
        // 连接钱包
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    userAddress = accounts[0];
                    isConnected = true;
                    
                    document.getElementById('walletStatus').textContent = '✅ ' + userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
                    document.getElementById('walletStatus').style.color = '#07c160';
                    document.getElementById('connectBtn').textContent = '已连接';
                    document.getElementById('connectBtn').style.background = '#ccc';
                    document.getElementById('connectBtn').disabled = true;
                    
                    // 显示欢迎消息
                    if (messageCount === 0) {
                        document.getElementById('emptyState').style.display = 'none';
                        addMessage('system', '欢迎来到币圈社区！🎉', '系统');
                    }
                } catch (error) {
                    alert('连接失败：' + error.message);
                }
            } else {
                alert('请安装MetaMask钱包');
            }
        }
        
        // 发送消息
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage('own', text, userAddress.slice(0, 6) + '...' + userAddress.slice(-4));
            input.value = '';
            document.getElementById('sendBtn').disabled = true;
            
            // 模拟回复
            setTimeout(() => {
                const replies = ['收到！', '👍', '同意', '有道理', '关注一下', '好项目！'];
                const reply = replies[Math.floor(Math.random() * replies.length)];
                addMessage('other', reply, '币圈助手');
            }, 1000 + Math.random() * 2000);
        }
        
        // 添加消息
        function addMessage(type, text, sender) {
            const messages = document.getElementById('messages');
            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.style.display = 'none';
            
            messageCount++;
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper ' + (type === 'own' ? 'own' : (type === 'system' ? 'system' : 'other'));
            
            if (type === 'system') {
                wrapper.style.alignSelf = 'center';
                wrapper.style.maxWidth = '90%';
                wrapper.innerHTML = `
                    <div style="background:#dadada;padding:8px 15px;border-radius:5px;font-size:13px;color:#666;text-align:center">
                        ${text}
                    </div>
                `;
            } else {
                const avatarColor = type === 'own' ? '#07c160' : '#f7931a';
                const avatarText = type === 'own' ? '我' : '助';
                wrapper.innerHTML = `
                    <div class="msg-avatar" style="background:${avatarColor}">${avatarText}</div>
                    <div class="msg-body">
                        <span class="msg-sender">${sender}</span>
                        <div class="msg-bubble">${text}</div>
                        <span class="msg-time">${new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}</span>
                    </div>
                `;
            }
            
            messages.appendChild(wrapper);
            messages.scrollTop = messages.scrollHeight;
        }
        
        // 输入框监听
        document.getElementById('msgInput').addEventListener('input', function() {
            document.getElementById('sendBtn').disabled = !this.value.trim();
        });
        
        // 表情按钮
        document.querySelector('.emoji-btn').addEventListener('click', function() {
            const input = document.getElementById('msgInput');
            input.value += ' 😊';
            input.focus();
            document.getElementById('sendBtn').disabled = false;
        });
        
        // 语音按钮
        document.querySelector('.voice-btn').addEventListener('click', function() {
            alert('语音功能开发中...');
        });
        
        // 添加按钮
        document.querySelector('.add-btn').addEventListener('click', function() {
            alert('更多功能开发中...');
        });
    </script>
</body>
</html>
