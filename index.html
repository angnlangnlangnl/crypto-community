<script>
    // ===== GitHub Issues 聊天配置（优化版） =====
    const GITHUB_CONFIG = {
        owner: 'angnlangnlangnl',
        repo: 'crypto-community',
        issueNumber: 1,
        pollInterval: 1500,  // 从3000ms优化到1500ms，减少延迟
        lastCommentId: 0,
        processedMessages: new Set()  // 去重
    };

    let currentUserAddress = '';
    let currentUsername = '';

    // 获取Issue评论（消息）
    async function fetchMessages() {
        try {
            const response = await fetch(
                `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/issues/${GITHUB_CONFIG.issueNumber}/comments?per_page=50&_=${Date.now()}`,
                {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Cache-Control': 'no-cache'
                    }
                }
            );
            
            if (!response.ok) {
                throw new Error('获取消息失败');
            }
            
            const comments = await response.json();
            return comments;
        } catch (error) {
            console.error('获取消息错误:', error);
            return [];
        }
    }

    // 发送消息（创建评论）- 支持图片和视频
    async function sendMessageToGitHub(content, type, mediaData) {
        try {
            const token = localStorage.getItem('github_token');
            
            if (!token) {
                addSystemMessage('⚠️ 请先设置 GitHub Token 才能发送消息');
                promptForToken();
                return;
            }
            
            const messageData = {
                address: currentUserAddress,
                username: currentUsername,
                content: content || '',
                type: type || 'text',
                mediaData: mediaData || null,
                timestamp: Date.now()
            };
            
            const response = await fetch(
                `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/issues/${GITHUB_CONFIG.issueNumber}/comments`,
                {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json',
                        'Authorization': `token ${token}`
                    },
                    body: JSON.stringify({
                        body: `[CHAT]${JSON.stringify(messageData)}`
                    })
                }
            );
            
            if (!response.ok) {
                throw new Error('发送失败');
            }
            
            const result = await response.json();
            // 立即刷新消息
            pollMessages();
            return result;
        } catch (error) {
            console.error('发送消息错误:', error);
            addSystemMessage('❌ 发送失败：' + error.message);
            return null;
        }
    }

    // 设置 GitHub Token（优化版弹窗）
    function promptForToken() {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:5000;display:flex;align-items:center;justify-content:center;padding:20px;';
        
        const modal = document.createElement('div');
        modal.style.cssText = 'background:white;border-radius:12px;padding:24px;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.3);';
        
        modal.innerHTML = `
            <h3 style="margin:0 0 16px;font-size:18px;color:#333;">🔑 设置 GitHub Token</h3>
            <p style="margin:0 0 12px;font-size:13px;color:#666;line-height:1.5;">
                需要 GitHub Token 才能发送消息。<br>
                获取方式：<br>
                1. 访问 <a href="https://github.com/settings/tokens" target="_blank" style="color:#07c160;">github.com/settings/tokens</a><br>
                2. 点击 "Generate new token"<br>
                3. 勾选 "public_repo" 权限<br>
                4. 生成并复制 Token
            </p>
            <input type="password" id="tokenInput" placeholder="粘贴 GitHub Token (ghp_...)" 
                   style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px;box-sizing:border-box;">
            <div style="display:flex;gap:10px;">
                <button id="tokenCancel" style="flex:1;padding:12px;background:#f0f0f0;border:none;border-radius:8px;cursor:pointer;font-size:14px;color:#333;">取消</button>
                <button id="tokenSave" style="flex:1;padding:12px;background:#07c160;border:none;border-radius:8px;cursor:pointer;font-size:14px;color:white;font-weight:500;">保存</button>
            </div>
        `;
        
        overlay.appendChild(modal);
        document.body.appendChild(overlay);
        
        const tokenInput = document.getElementById('tokenInput');
        tokenInput.focus();
        
        document.getElementById('tokenSave').onclick = function() {
            const token = tokenInput.value.trim();
            if (token) {
                localStorage.setItem('github_token', token);
                addSystemMessage('✅ Token 已保存，可以开始聊天了！');
            }
            document.body.removeChild(overlay);
        };
        
        document.getElementById('tokenCancel').onclick = function() {
            document.body.removeChild(overlay);
        };
        
        tokenInput.onkeypress = function(e) {
            if (e.key === 'Enter') {
                document.getElementById('tokenSave').click();
            }
        };
    }

    // 解析消息（支持图片和视频）
    function parseMessage(comment) {
        try {
            const body = comment.body;
            if (body.startsWith('[CHAT]')) {
                const data = JSON.parse(body.slice(6));
                return {
                    id: comment.id,
                    address: data.address,
                    username: data.username,
                    content: data.content || '',
                    type: data.type || 'text',
                    mediaData: data.mediaData || null,
                    timestamp: data.timestamp || new Date(comment.created_at).getTime(),
                    created_at: comment.created_at
                };
            }
            return null;
        } catch (error) {
            return null;
        }
    }

    // 轮询新消息（优化版，去重+快速响应）
    async function pollMessages() {
        const comments = await fetchMessages();
        
        if (comments.length > 0) {
            const lastComment = comments[comments.length - 1];
            
            if (lastComment.id !== GITHUB_CONFIG.lastCommentId) {
                comments.forEach(comment => {
                    // 去重处理
                    if (!GITHUB_CONFIG.processedMessages.has(comment.id) && comment.id > GITHUB_CONFIG.lastCommentId) {
                        GITHUB_CONFIG.processedMessages.add(comment.id);
                        
                        const message = parseMessage(comment);
                        if (message && message.address !== currentUserAddress) {
                            displayIncomingMessage(message);
                        }
                    }
                });
                
                GITHUB_CONFIG.lastCommentId = lastComment.id;
            }
        }
    }

    // 显示收到的消息（支持图片和视频）
    function displayIncomingMessage(message) {
        if (message.type === 'image' && message.mediaData) {
            addOtherImageMessage(message.mediaData, message.username);
        } else if (message.type === 'video' && message.mediaData) {
            addOtherVideoMessage(message.mediaData, message.username);
        } else {
            addOtherMessage(message.content, message.username);
        }
    }

    // 加载历史消息（支持图片和视频）
    async function loadHistoryMessages() {
        const comments = await fetchMessages();
        
        if (comments.length > 0) {
            GITHUB_CONFIG.lastCommentId = comments[comments.length - 1].id;
            
            const recentComments = comments.slice(-30);
            recentComments.forEach(comment => {
                GITHUB_CONFIG.processedMessages.add(comment.id);
                const message = parseMessage(comment);
                if (message) {
                    if (message.address === currentUserAddress) {
                        if (message.type === 'image' && message.mediaData) {
                            addOwnImageMessage(message.mediaData, message.username);
                        } else if (message.type === 'video' && message.mediaData) {
                            addOwnVideoMessage(message.mediaData, message.username);
                        } else {
                            addOwnMessage(message.content, message.username);
                        }
                    } else {
                        displayIncomingMessage(message);
                    }
                }
            });
        }
    }

    // 启动轮询
    function startPolling() {
        loadHistoryMessages();
        setInterval(pollMessages, GITHUB_CONFIG.pollInterval);
    }

    // 存储Object URL引用，防止GC
    if (!window._videoBlobUrls) window._videoBlobUrls = {};
    
    // ===== 全屏图片缩放控制 =====
    var imageScale = 1;
    var imageTranslateX = 0;
    var imageTranslateY = 0;
    var isImageZoomed = false;
    var isDragging = false;
    var dragStartX = 0;
    var dragStartY = 0;
    var dragStartTranslateX = 0;
    var dragStartTranslateY = 0;
    var lastTouchDistance = 0;
    var currentImageWrap = null;
    var currentImage = null;
    var zoomHintTimeout = null;
    var isFullscreenImage = false;
    
    function constrainTransform(img, scale, tx, ty) {
        if (!img) return { tx: 0, ty: 0 };
        var container = img.parentElement;
        if (!container) return { tx: 0, ty: 0 };
        var ch = container.clientHeight;
        var imgW = img.naturalWidth || img.width || 1;
        var imgH = img.naturalHeight || img.height || 1;
        var scaledH = imgH * scale;
        tx = 0;
        if (scaledH > ch) {
            var maxY = scaledH - ch;
            ty = Math.max(-maxY, Math.min(0, ty));
        } else {
            ty = (ch - scaledH) / 2;
        }
        return { tx: tx, ty: ty };
    }
    
    function initImageZoom(imageWrap, img) {
        currentImageWrap = imageWrap;
        currentImage = img;
        imageScale = 1;
        imageTranslateX = 0;
        imageTranslateY = 0;
        isImageZoomed = false;
        isFullscreenImage = true;
        img.className = '';
        showZoomHint();
        img.removeEventListener('dblclick', onImageDblClick);
        img.removeEventListener('touchstart', onImageTouchStart);
        img.removeEventListener('touchmove', onImageTouchMove);
        img.removeEventListener('touchend', onImageTouchEnd);
        img.removeEventListener('mousedown', onImageMouseDown);
        document.removeEventListener('mousemove', onImageMouseMove);
        document.removeEventListener('mouseup', onImageMouseUp);
        img.addEventListener('dblclick', onImageDblClick);
        img.addEventListener('touchstart', onImageTouchStart, { passive: false });
        img.addEventListener('touchmove', onImageTouchMove, { passive: false });
        img.addEventListener('touchend', onImageTouchEnd, { passive: false });
        img.addEventListener('mousedown', onImageMouseDown);
        function applySmartZoom() {
            var container = imageWrap;
            var containerWidth = container.clientWidth;
            var containerHeight = container.clientHeight;
            var imgWidth = img.naturalWidth || img.width;
            var imgHeight = img.naturalHeight || img.height;
            if (containerWidth === 0 || imgWidth === 0 || imgHeight === 0) {
                requestAnimationFrame(applySmartZoom);
                return;
            }
            var scaleToFitWidth = containerWidth / imgWidth;
            scaleToFitWidth = Math.min(scaleToFitWidth, 8);
            scaleToFitWidth = Math.max(scaleToFitWidth, 1);
            imageScale = scaleToFitWidth;
            imageTranslateX = 0;
            var scaledHeight = imgHeight * imageScale;
            if (scaledHeight > containerHeight) {
                imageTranslateY = 0;
                img.style.transformOrigin = 'top center';
            } else {
                imageTranslateY = (containerHeight - scaledHeight) / 2;
                img.style.transformOrigin = 'center center';
            }
            isImageZoomed = true;
            img.className = 'zoomed';
            img.style.transform = 'translate(0px, ' + imageTranslateY + 'px) scale(' + imageScale + ')';
        }
        img.onload = function() { requestAnimationFrame(applySmartZoom); };
        if (img.complete && img.naturalWidth > 0) {
            requestAnimationFrame(applySmartZoom);
        } else {
            setTimeout(function() {
                if (img.complete && img.naturalWidth > 0) { requestAnimationFrame(applySmartZoom); }
            }, 100);
        }
    }
    
    function showZoomHint() {
        var hint = document.getElementById('zoomHint');
        if (!hint) return;
        hint.classList.add('show');
        if (zoomHintTimeout) clearTimeout(zoomHintTimeout);
        zoomHintTimeout = setTimeout(function() { hint.classList.remove('show'); }, 3000);
    }
    
    function onImageDblClick(e) {
        e.stopPropagation();
        var img = currentImage;
        if (!img) return;
        if (!isImageZoomed) {
            var container = img.parentElement;
            var containerWidth = container.clientWidth;
            var containerHeight = container.clientHeight;
            var imgWidth = img.naturalWidth || img.width;
            var imgHeight = img.naturalHeight || img.height;
            if (imgWidth === 0 || imgHeight === 0) return;
            var scale = containerWidth / imgWidth;
            scale = Math.min(scale, 8);
            scale = Math.max(scale, 1);
            imageScale = scale;
            imageTranslateX = 0;
            var scaledHeight = imgHeight * imageScale;
            if (scaledHeight > containerHeight) {
                imageTranslateY = 0;
                img.style.transformOrigin = 'top center';
            } else {
                imageTranslateY = (containerHeight - scaledHeight) / 2;
                img.style.transformOrigin = 'center center';
            }
            isImageZoomed = true;
            img.className = 'zoomed';
            img.style.transform = 'translate(0px, ' + imageTranslateY + 'px) scale(' + imageScale + ')';
        } else {
            imageScale = 1;
            imageTranslateX = 0;
            imageTranslateY = 0;
            isImageZoomed = false;
            img.className = '';
            img.style.transform = 'translate(0px, 0px) scale(1)';
            img.style.transformOrigin = 'center center';
        }
    }
    
    function onImageTouchStart(e) {
        if (e.touches.length === 2) {
            var touch1 = e.touches[0];
            var touch2 = e.touches[1];
            lastTouchDistance = Math.hypot(touch1.clientX - touch2.clientX, touch1.clientY - touch2.clientY);
            isDragging = false;
        } else if (e.touches.length === 1) {
            isDragging = true;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
            dragStartTranslateX = imageTranslateX;
            dragStartTranslateY = imageTranslateY;
        }
    }
    
    function onImageTouchMove(e) {
        e.preventDefault();
        var img = currentImage;
        if (!img) return;
        if (e.touches.length === 2) {
            var touch1 = e.touches[0];
            var touch2 = e.touches[1];
            var currentDistance = Math.hypot(touch1.clientX - touch2.clientX, touch1.clientY - touch2.clientY);
            if (lastTouchDistance > 0) {
                var scaleDelta = currentDistance / lastTouchDistance;
                var newScale = imageScale * scaleDelta;
                newScale = Math.max(1, Math.min(newScale, 8));
                var constrained = constrainTransform(img, newScale, 0, imageTranslateY);
                imageTranslateX = constrained.tx;
                imageTranslateY = constrained.ty;
                imageScale = newScale;
                img.style.transform = 'translate(' + imageTranslateX + 'px, ' + imageTranslateY + 'px) scale(' + imageScale + ')';
            }
            lastTouchDistance = currentDistance;
            isDragging = false;
        } else if (e.touches.length === 1 && isDragging) {
            var dy = e.touches[0].clientY - dragStartY;
            var newTy = dragStartTranslateY + dy;
            var constrained = constrainTransform(img, imageScale, 0, newTy);
            imageTranslateX = constrained.tx;
            imageTranslateY = constrained.ty;
            img.style.transform = 'translate(' + imageTranslateX + 'px, ' + imageTranslateY + 'px) scale(' + imageScale + ')';
        }
    }
    
    function onImageTouchEnd(e) {
        if (e.touches.length === 0) {
            isDragging = false;
            lastTouchDistance = 0;
            isImageZoomed = imageScale > 1;
        }
    }
    
    function onImageMouseDown(e) {
        if (e.button !== 0) return;
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragStartTranslateX = imageTranslateX;
        dragStartTranslateY = imageTranslateY;
        e.preventDefault();
        document.addEventListener('mousemove', onImageMouseMove);
        document.addEventListener('mouseup', onImageMouseUp);
    }
    
    function onImageMouseMove(e) {
        if (!isDragging) return;
        var img = currentImage;
        if (!img) return;
        var dy = e.clientY - dragStartY;
        var newTy = dragStartTranslateY + dy;
        var constrained = constrainTransform(img, imageScale, 0, newTy);
        imageTranslateX = constrained.tx;
        imageTranslateY = constrained.ty;
        img.style.transform = 'translate(' + imageTranslateX + 'px, ' + imageTranslateY + 'px) scale(' + imageScale + ')';
    }
    
    function onImageMouseUp(e) {
        isDragging = false;
        document.removeEventListener('mousemove', onImageMouseMove);
        document.removeEventListener('mouseup', onImageMouseUp);
    }
    
    function resetImageZoom() {
        if (currentImage) {
            imageScale = 1;
            imageTranslateX = 0;
            imageTranslateY = 0;
            isImageZoomed = false;
            currentImage.className = '';
            currentImage.style.transform = 'translate(0px, 0px) scale(1)';
            currentImage.style.transformOrigin = 'center center';
        }
        isDragging = false;
        lastTouchDistance = 0;
        isFullscreenImage = false;
        document.removeEventListener('mousemove', onImageMouseMove);
        document.removeEventListener('mouseup', onImageMouseUp);
        var hint = document.getElementById('zoomHint');
        if (hint) hint.classList.remove('show');
        if (zoomHintTimeout) { clearTimeout(zoomHintTimeout); zoomHintTimeout = null; }
    }
    
    // ===== 会议功能 =====
    function handleEnterMeeting() { openModal('meetingModal'); }
    function joinMeeting() {
        var link = document.createElement('a');
        link.href = 'https://meeting.tencent.com/dm/hIbayciQ5BHJ';
        link.target = '_blank';
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        closeModal('meetingModal');
        addSystemMessage('📞 正在尝试加入会议...');
        setTimeout(function() { addSystemMessage('✅ 已打开腾讯会议，请确认加入'); }, 1500);
    }
    function copyMeetingInfo() {
        var info = '悟 邀请您参加腾讯会议\n会议主题：悟的快速会议\n会议时间：2026/08/22 15:30-16:30 (GMT+08:00) 中国标准时间 - 北京\n\n点击链接直接加入会议：\nhttps://meeting.tencent.com/dm/hIbayciQ5BHJ\n\n#腾讯会议：945-379-565\n\n复制该信息，打开手机腾讯会议即可参与';
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(info).then(function() { addSystemMessage('✅ 会议信息已复制到剪贴板'); }).catch(function() { fallbackCopy(info); });
        } else { fallbackCopy(info); }
        closeModal('meetingModal');
    }
    function fallbackCopy(text) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand('copy'); addSystemMessage('✅ 会议信息已复制到剪贴板'); } catch (e) { addSystemMessage('⚠️ 复制失败，请手动复制'); }
        document.body.removeChild(textarea);
    }
    
    // ===== 全屏播放器控制 =====
    var fullscreenVideo = null;
    var isVideoPaused = false;
    function openFullscreen(mediaUrl, type) {
        var player = document.getElementById('fullscreenPlayer');
        var content = document.getElementById('fullscreenContent');
        var controls = document.getElementById('fullscreenControls');
        var pauseOverlay = document.getElementById('pauseOverlay');
        content.innerHTML = '';
        controls.style.display = 'none';
        if (pauseOverlay) pauseOverlay.classList.remove('show');
        resetImageZoom();
        if (type === 'image') {
            var wrap = document.createElement('div');
            wrap.className = 'image-wrap';
            var img = document.createElement('img');
            img.src = mediaUrl;
            img.style.cssText = 'display:block;border:none;outline:none;image-orientation:from-image;max-width:100%;max-height:none;width:auto;height:auto;';
            wrap.appendChild(img);
            content.appendChild(wrap);
            player.classList.add('active');
            document.body.style.overflow = 'hidden';
            initImageZoom(wrap, img);
            return;
        }
        if (type === 'video') {
            var video = document.createElement('video');
            video.src = mediaUrl;
            video.style.cssText = 'height:100vh;width:auto;max-width:100vw;object-fit:contain;border:none;outline:none;display:block;background:#000;cursor:pointer;';
            video.playsInline = true;
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.preload = 'auto';
            video.controls = false;
            content.appendChild(video);
            controls.style.display = 'flex';
            player.classList.add('active');
            document.body.style.overflow = 'hidden';
            fullscreenVideo = video;
            isVideoPaused = true;
            if (pauseOverlay) pauseOverlay.classList.add('show');
            var timeDisplay = document.getElementById('fullscreenTime');
            var progressFill = document.getElementById('fullscreenProgressFill');
            var progressBar = document.getElementById('fullscreenProgress');
            var dot = progressBar.querySelector('.progress-dot');
            video.addEventListener('loadedmetadata', function() { updateFullscreenTime(); });
            video.onclick = function(e) {
                e.stopPropagation();
                if (video.paused) { video.play().catch(function() {}); if (pauseOverlay) pauseOverlay.classList.remove('show'); isVideoPaused = false; }
                else { video.pause(); if (pauseOverlay) pauseOverlay.classList.add('show'); isVideoPaused = true; }
            };
            video.addEventListener('timeupdate', function() { updateFullscreenTime(); if (video.duration) { var pct = (video.currentTime / video.duration) * 100; progressFill.style.width = pct + '%'; if (dot) dot.style.left = pct + '%'; } });
            video.addEventListener('play', function() { if (pauseOverlay) pauseOverlay.classList.remove('show'); isVideoPaused = false; });
            video.addEventListener('pause', function() { if (pauseOverlay && !video.ended) pauseOverlay.classList.add('show'); isVideoPaused = true; });
            video.addEventListener('ended', function() { if (pauseOverlay) pauseOverlay.classList.add('show'); video.currentTime = 0; progressFill.style.width = '0%'; if (dot) dot.style.left = '0%'; isVideoPaused = true; });
            progressBar.onclick = function(e) { e.stopPropagation(); var rect = progressBar.getBoundingClientRect(); var percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)); if (video.duration) { video.currentTime = percent * video.duration; } };
            setTimeout(function() { video.play().then(function() { if (pauseOverlay) pauseOverlay.classList.remove('show'); isVideoPaused = false; }).catch(function() { if (pauseOverlay) pauseOverlay.classList.add('show'); isVideoPaused = true; }); }, 200);
        }
    }
    function updateFullscreenTime() {
        if (!fullscreenVideo) return;
        var timeDisplay = document.getElementById('fullscreenTime');
        if (!timeDisplay) return;
        var current = formatFullscreenTime(fullscreenVideo.currentTime);
        var total = formatFullscreenTime(fullscreenVideo.duration || 0);
        timeDisplay.textContent = current + ' / ' + total;
    }
    function formatFullscreenTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '00:00';
        var s = Math.floor(seconds);
        var m = Math.floor(s / 60);
        var secs = s % 60;
        return String(m).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }
    function closeFullscreen() {
        var player = document.getElementById('fullscreenPlayer');
        player.classList.remove('active');
        document.body.style.overflow = '';
        if (fullscreenVideo) { try { fullscreenVideo.pause(); } catch(e) {} fullscreenVideo = null; }
        var pauseOverlay = document.getElementById('pauseOverlay');
        if (pauseOverlay) pauseOverlay.classList.remove('show');
        isVideoPaused = false;
        resetImageZoom();
    }
    
    // ===== 会议倒计时 =====
    var countdownSeconds = 300;
    var countdownInterval = null;
    function updateCountdown() {
        var display = document.getElementById('countdownDisplay');
        if (!display) return;
        var mins = String(Math.floor(countdownSeconds / 60)).padStart(2, '0');
        var secs = String(countdownSeconds % 60).padStart(2, '0');
        display.textContent = mins + ':' + secs;
        if (countdownSeconds <= 0) { clearInterval(countdownInterval); countdownInterval = null; display.textContent = '00:00'; display.classList.add('ended'); handleEnterMeeting(); }
        else { display.classList.remove('ended'); }
    }
    function startCountdown() {
        if (countdownInterval) clearInterval(countdownInterval);
        countdownSeconds = 300;
        var display = document.getElementById('countdownDisplay');
        if (display) display.classList.remove('ended');
        updateCountdown();

    function initSpeechRecognition() {
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return null;
        var recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onresult = function(event) {
            var finalText = '';
            for (var i = event.resultIndex; i < event.results.length; i++) {
                if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
            }
            if (finalText) recognizedText = finalText;
            var input = document.getElementById('msgInput');
            if (input && isRecording) {
                if (recognizedText) input.value = recognizedText;
                else input.value = '录音中 ' + recordingDuration + 's';
            }
        };
        recognition.onend = function() { isRecognizing = false; if (isRecording && speechRecognition) { try { speechRecognition.start(); isRecognizing = true; } catch(e) {} } };
        return recognition;
    }

    function addVoiceMessage(duration, audioBlob, sender, text) {
        messageCount++;
        var messages = document.getElementById('messages');
        document.getElementById('emptyState').style.display = 'none';
        var msgId = 'voice_' + Date.now();
        if (!window._voiceData) window._voiceData = {};
        window._voiceData[msgId] = audioBlob;
        var wrapper = document.createElement('div');
        wrapper.className = 'msg-wrapper own';
        var durationStr = formatDuration(duration);
        var voiceWidth = getVoiceWidth(duration);
        wrapper.innerHTML = '<div class="msg-avatar">我</div><div class="msg-body"><span class="msg-sender">我</span><div class="msg-bubble" style="padding:4px 0;"><div class="voice-msg-wrapper" onclick="playVoiceMessage(\'' + msgId + '\')" style="width:' + voiceWidth + 'px;"><span class="voice-icon" id="voiceIcon_' + msgId + '"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#07c160" stroke-width="1.5"><path d="M11 5L6 9H2v6h4l5 4V5z"/></svg></span><span class="duration">' + durationStr + '</span></div></div><span class="msg-time">' + getTime() + '</span></div>';
        messages.appendChild(wrapper);
        scrollToBottom();
    }
    
    function getVoiceWidth(duration) {
        var minWidth = 60, maxWidth = 200, minDuration = 1, maxDuration = 60;
        var width = minWidth + (maxWidth - minWidth) * (duration - minDuration) / (maxDuration - minDuration);
        return Math.max(minWidth, Math.min(maxWidth, Math.round(width)));
    }
    function formatDuration(seconds) {
        var s = Math.floor(seconds), m = Math.floor(s / 60), secs = s % 60;
        return m > 0 ? m + ':' + String(secs).padStart(2, '0') : '0:' + String(secs).padStart(2, '0');
    }
    function playVoiceMessage(msgId) {
        var data = window._voiceData;
        if (!data || !data[msgId]) return;
        if (currentAudio) { currentAudio.pause(); if (currentPlayingId) updateSpeakerIcon(currentPlayingId, 'idle'); }
        var audioBlob = data[msgId];
        var url = URL.createObjectURL(audioBlob);
        var audio = new Audio(url);
        currentAudio = audio;
        currentPlayingId = msgId;
        updateSpeakerIcon(msgId, 'playing');
        audio.onended = function() { updateSpeakerIcon(msgId, 'idle'); currentAudio = null; currentPlayingId = null; };
        audio.play().catch(function() {});
    }

        } else {

    }

    // ===== 语音模式 =====
    function toggleVoiceMode() {
        var input = document.getElementById('msgInput');
        var voiceBtn = document.getElementById('voiceBtn');
        if (!isVoiceMode) {
            isVoiceMode = true;
            input.placeholder = '按住录音，松开发送';
            input.readOnly = true;
            input.style.background = '#f0f0f0';
            input.style.textAlign = 'center';
            input.style.userSelect = 'none';
            voiceBtn.style.background = '#e8f5e9';
            voiceBtn.style.borderRadius = '50%';
            input.addEventListener('pointerdown', onPointerDown);
            input.addEventListener('pointerup', onPointerUp);
            input.addEventListener('pointerleave', onPointerUp);
            input.addEventListener('pointermove', onPointerMove);
            addSystemMessage('录音模式已开启，按住输入框录音');
        } else {
            isVoiceMode = false;
            input.placeholder = '输入消息...';
            input.readOnly = false;
            input.style.background = 'white';
            input.style.textAlign = 'left';
            input.style.userSelect = 'auto';
            voiceBtn.style.background = 'transparent';
            input.removeEventListener('pointerdown', onPointerDown);
            input.removeEventListener('pointerup', onPointerUp);
            input.removeEventListener('pointerleave', onPointerUp);
            input.removeEventListener('pointermove', onPointerMove);
            if (isRecording) stopRecording(false);
        }
    }
    function onPointerDown(e) { e.preventDefault(); if (!isVoiceMode || isRecording) return; pointerStartY = e.clientY; isCancelMode = false; startRecording(); }
    function onPointerMove(e) { if (!isRecording) return; isCancelMode = (pointerStartY - e.clientY) > 60; document.getElementById('cancelTip').classList.toggle('show', isCancelMode); }
    function onPointerUp(e) { if (isRecording) stopRecording(!isCancelMode); isCancelMode = false; document.getElementById('cancelTip').classList.remove('show'); }
    var VOICE_CONFIG = { minDuration: 1, maxDuration: 60 };
    
    async function startRecording() {
        try {
            var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            isRecording = true;
            audioChunks = [];
            recordingDuration = 0;
            recognizedText = '';
            var input = document.getElementById('msgInput');
            input.classList.add('recording');
            input.value = '录音中 0s';
            if (!speechRecognition) speechRecognition = initSpeechRecognition();
            if (speechRecognition && !isRecognizing) { try { speechRecognition.start(); isRecognizing = true; } catch(e) {} }
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = function(event) { if (event.data.size > 0) audioChunks.push(event.data); };
            mediaRecorder.onstop = function() { stream.getTracks().forEach(function(track) { track.stop(); }); };
            mediaRecorder.start(100);
            recordingTimer = setInterval(function() {
                recordingDuration++;
                var input = document.getElementById('msgInput');
                if (input && isRecording) { if (!recognizedText) input.value = '录音中 ' + recordingDuration + 's'; }
                if (recordingDuration >= VOICE_CONFIG.maxDuration) stopRecording(true);
            }, 1000);
        } catch (err) { isRecording = false; document.getElementById('msgInput').classList.remove('recording'); document.getElementById('msgInput').value = ''; }
    }
    function stopRecording(send) {
        if (!isRecording) return;
        isRecording = false;
        if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        if (speechRecognition && isRecognizing) { try { speechRecognition.stop(); } catch(e) {} isRecognizing = false; }
        var input = document.getElementById('msgInput');
        input.classList.remove('recording');
        input.style.background = '#f0f0f0';
        input.value = '';
        input.placeholder = '按住录音，松开发送';
        document.getElementById('cancelTip').classList.remove('show');
        var duration = recordingDuration;
        if (!send || duration < 1) { audioChunks = []; return; }
        if (audioChunks.length > 0) {
            var audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            addVoiceMessage(duration, audioBlob, userAddress || '我');
        }
        audioChunks = [];
    }
