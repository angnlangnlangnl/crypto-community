<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a1a2e"><meta name="description" content="去中心化币圈社群聊天软件 - BSC链DApp"><title>🚀 币圈社区 - 去中心化聊天</title><style>:root{--primary:#f7931a;--bg-primary:#1a1a2e;--bg-secondary:#16213e;--bg-tertiary:#0f3460;--text-primary:#ffffff;--text-secondary:#b0b0b0;--border:#2d2d44;--success:#00c853;--danger:#ff1744}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden}.header{display:flex;justify-content:space-between;align-items:center;padding:0 20px;height:64px;background:var(--bg-secondary);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:var(--primary)}.header-right{display:flex;align-items:center;gap:15px}.btn{padding:10px 20px;border:none;border-radius:25px;cursor:pointer;font-size:14px;font-weight:500;transition:all .3s;display:flex;align-items:center;gap:8px}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(247,147,26,.3)}.btn-secondary{background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border)}.price-ticker{background:var(--bg-secondary);border-bottom:1px solid var(--border);overflow:hidden;height:36px;display:flex;align-items:center}.ticker-scroll{display:flex;animation:scroll 30s linear infinite;white-space:nowrap}@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}.ticker-item{display:inline-flex;align-items:center;gap:8px;padding:0 20px;font-size:13px}.ticker-symbol{font-weight:700;color:var(--text-primary)}.ticker-price{color:var(--text-secondary)}.ticker-change.positive{color:var(--success)}.ticker-change.negative{color:var(--danger)}.main-content{display:flex;min-height:calc(100vh - 100px)}.sidebar{width:250px;background:var(--bg-secondary);border-right:1px solid var(--border);padding:20px;overflow-y:auto}.sidebar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.sidebar-header h3{font-size:16px;color:var(--text-primary)}.create-btn{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .3s}.create-btn:hover{transform:scale(1.1)}.channel-list{display:flex;flex-direction:column;gap:5px}.channel-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;cursor:pointer;transition:all .3s;color:var(--text-secondary)}.channel-item:hover{background:var(--bg-tertiary);color:var(--text-primary)}.channel-item.active{background:var(--primary);color:#fff}.chat-area{flex:1;display:flex;flex-direction:column}.chat-header{padding:20px;background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.messages-container{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:15px}.message{display:flex;gap:12px;padding:12px;background:var(--bg-secondary);border-radius:8px;animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.message-avatar{width:40px;height:40px;border-radius:50%;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--primary);flex-shrink:0}.message-content{flex:1}.message-sender{font-weight:500;color:var(--primary);margin-bottom:5px;font-size:13px}.message-text{color:var(--text-primary);font-size:14px;line-height:1.5}.message-input-container{display:flex;gap:10px;padding:20px;background:var(--bg-secondary);border-top:1px solid var(--border)}.message-input-container input{flex:1;padding:12px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:25px;color:var(--text-primary);font-size:14px;outline:0;transition:border-color .3s}.message-input-container input:focus{border-color:var(--primary)}.send-btn{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .3s}.send-btn:hover{transform:scale(1.1)}.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center}.welcome h2{font-size:32px;margin-bottom:15px;color:var(--primary)}.welcome p{color:var(--text-secondary);font-size:16px;margin-bottom:30px}.welcome .features{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}.feature-card{background:var(--bg-secondary);padding:25px;border-radius:12px;width:180px;transition:all .3s;cursor:pointer}.feature-card:hover{transform:translateY(-5px);box-shadow:0 10px 20px rgba(0,0,0,.3)}.feature-icon{font-size:32px;margin-bottom:15px}.feature-title{font-weight:700;margin-bottom:8px;color:var(--text-primary)}.feature-desc{font-size:12px;color:var(--text-secondary);line-height:1.4}.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal.show{display:flex}.modal-content{background:var(--bg-secondary);border-radius:12px;padding:30px;width:90%;max-width:400px;animation:fadeIn .3s ease}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-header h3{color:var(--text-primary)}.close-btn{background:0 0;border:none;color:var(--text-secondary);font-size:20px;cursor:pointer}@media (max-width:768px){.main-content{flex-direction:column}.sidebar{width:100%;height:auto;max-height:200px}.header{padding:0 10px}}</style><script defer="defer" src="/static/js/main.b64b0eaf.js"></script><link href="/static/css/main.fd450b82.css" rel="stylesheet"></head><body><header class="header"><div class="logo">🚀 币圈社区</div><div class="header-right"><button class="btn btn-primary" id="connectBtn" onclick="connectWallet()">🔗 连接钱包</button></div></header><div class="price-ticker"><div class="ticker-scroll" id="tickerScroll"></div></div><div class="main-content"><aside class="sidebar" id="sidebar" style="display:none"><div class="sidebar-header"><h3>频道列表</h3><button class="create-btn" onclick="showCreateChannel()">+</button></div><div class="channel-list" id="channelList"><div class="channel-item active"># 综合讨论</div><div class="channel-item"># 技术分析</div><div class="channel-item"># 项目动态</div></div></aside><div class="chat-area"><div id="welcomeScreen" class="welcome"><h2>欢迎来到币圈社区</h2><p>连接钱包开始使用去中心化聊天</p><div class="features"><div class="feature-card"><div class="feature-icon">💬</div><div class="feature-title">去中心化聊天</div><div class="feature-desc">基于BSC链的消息传递，安全可靠</div></div><div class="feature-card"><div class="feature-icon">💰</div><div class="feature-title">代币奖励</div><div class="feature-desc">活跃参与获得CHAT代币激励</div></div><div class="feature-card"><div class="feature-icon">👥</div><div class="feature-title">社区治理</div><div class="feature-desc">DAO模式，社区成员共同决策</div></div></div></div></div></div><div class="modal" id="createChannelModal"><div class="modal-content"><div class="modal-header"><h3>创建新频道</h3><button class="close-btn" onclick="hideCreateChannel()">✕</button></div><input id="channelName" placeholder="频道名称" style="width:100%;padding:12px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:8px;color:#fff;margin-bottom:15px"> <button class="btn btn-primary" onclick="createChannel()" style="width:100%;justify-content:center">创建频道</button></div></div><script>const prices=[{symbol:"BTC",price:43250.5,change:2.35},{symbol:"ETH",price:2250.75,change:1.85},{symbol:"BNB",price:305.2,change:-.45},{symbol:"SOL",price:98.6,change:5.2},{symbol:"ADA",price:.58,change:-1.25}];function initTicker(){const e=document.getElementById("tickerScroll"),n=[...prices,...prices].map(e=>`\n                <div class="ticker-item">\n                    <span class="ticker-symbol">${e.symbol}</span>\n                    <span class="ticker-price">$${e.price.toLocaleString()}</span>\n                    <span class="ticker-change ${e.change>=0?"positive":"negative"}">\n                        ${e.change>=0?"+":""}${e.change}%\n                    </span>\n                </div>\n            `).join("");e.innerHTML=n}async function connectWallet(){if(void 0!==window.ethereum)try{await window.ethereum.request({method:"eth_requestAccounts"});const e=(await window.ethereum.request({method:"eth_accounts"}))[0];document.getElementById("connectBtn").innerHTML=`✅ ${e.slice(0,6)}...${e.slice(-4)}`,document.getElementById("sidebar").style.display="block",document.getElementById("welcomeScreen").style.display="none",alert("钱包连接成功！\n完整功能正在开发中...")}catch(e){alert("连接失败："+e.message)}else alert("请安装MetaMask钱包"),window.open("https://metamask.io/download/","_blank")}function showCreateChannel(){document.getElementById("createChannelModal").classList.add("show")}function hideCreateChannel(){document.getElementById("createChannelModal").classList.remove("show")}function createChannel(){const e=document.getElementById("channelName").value;if(e.trim()){const n=document.getElementById("channelList"),t=document.createElement("div");t.className="channel-item",t.textContent="# "+e,n.appendChild(t),document.getElementById("channelName").value="",hideCreateChannel(),alert('频道 "'+e+'" 创建成功！')}}initTicker()</script></body></html>
