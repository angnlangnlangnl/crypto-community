<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>币圈社区</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #ededed;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #ededed;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #d9d9d9;
            flex-shrink: 0;
            min-width: 0;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .back-btn {
            font-size: 18px;
            cursor: pointer;
            color: #333;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .chat-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            cursor: pointer;
            color: #333;
            flex-shrink: 0;
            min-width: 0;
        }
        
        .header-address {
            font-size: 13px;
            font-weight: 500;
            color: #333;
            background: #e8e8e8;
            padding: 3px 10px;
            border-radius: 12px;
            font-family: monospace;
            letter-spacing: 0.3px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .header-more {
            flex-shrink: 0;
            font-size: 18px;
            line-height: 1;
        }
        
        .connect-banner {
            background: #f7f7f7;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        
        .connect-banner .avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #f7931a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .connect-banner .info {
            flex: 1;
            min-width: 0;
        }
        
        .connect-banner .name {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }
        
        .connect-banner .status {
            font-size: 11px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .connect-btn {
            padding: 6px 12px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        
        .connect-btn:disabled {
            background: #ccc;
            cursor: default;
        }
        
        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #ededed;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }
        
        .time-divider {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin: 5px 0;
        }
        
        .msg-wrapper {
            display: flex;
            gap: 10px;
            max-width: 75%;
            animation: msgIn 0.3s ease;
        }
        
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .msg-wrapper.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .msg-wrapper.other {
            align-self: flex-start;
        }
        
        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 13px;
        }
        
        .msg-wrapper.own .msg-avatar {
            background: #07c160;
        }
        
        .msg-wrapper.other .msg-avatar {
            background: #f7931a;
        }
        
        .msg-body {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }
        
        .msg-sender {
            font-size: 11px;
            color: #999;
        }
        
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            word-break: break-word;
        }
        
        .msg-wrapper.own .msg-bubble {
            background: #95ec69;
            color: #333;
            border-top-right-radius: 2px;
        }
        
        .msg-wrapper.other .msg-bubble {
            background: white;
            color: #333;
            border-top-left-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        
        .msg-time {
            font-size: 10px;
            color: #bbb;
            align-self: flex-end;
        }
        
        .system-msg {
            align-self: center;
            background: #dadada;
            padding: 7px 15px;
            border-radius: 5px;
            font-size: 13px;
            color: #666;
            text-align: center;
            max-width: 90%;
        }
        
        .empty-state {
            text-align: center;
            color: #ccc;
            margin-top: 40px;
        }
        
        .empty-state .icon {
            font-size: 50px;
            margin-bottom: 12px;
        }
        
        .empty-state p {
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        /* ========== 输入框上方工具栏 ========== */
        .toolbar {
            background: #f7f7f7;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        .toolbar::-webkit-scrollbar {
            height: 2px;
        }
        .toolbar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 2px;
        }
        .toolbar-btn {
            font-size: 12px;
            font-weight: 500;
            color: #333;
            background: white;
            border: 1px solid #ddd;
            border-radius: 14px;
            padding: 4px 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .toolbar-btn:active {
            transform: scale(0.95);
            background: #e8e8e8;
        }
        .toolbar-btn.meeting {
            color: #07c160;
            border-color: #07c160;
        }
        .toolbar-btn.meeting:hover {
            background: #07c160;
            color: white;
        }
        .toolbar-btn.official {
            color: #f7931a;
            border-color: #f7931a;
        }
        .toolbar-btn.official:hover {
            background: #f7931a;
            color: white;
        }
        .toolbar-btn.notice {
            color: #1a73e8;
            border-color: #1a73e8;
        }
        .toolbar-btn.notice:hover {
            background: #1a73e8;
            color: white;
        }
        .toolbar-btn.economy {
            color: #9c27b0;
            border-color: #9c27b0;
        }
        .toolbar-btn.economy:hover {
            background: #9c27b0;
            color: white;
        }
        .toolbar-btn.token {
            color: #e91e63;
            border-color: #e91e63;
        }
        .toolbar-btn.token:hover {
            background: #e91e63;
            color: white;
        }
        
        /* ========== 微信底部输入栏 ========== */
        .input-area {
            background: #f7f7f7;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
        
        .icon-btn {
            cursor: pointer;
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background 0.2s;
            background: none;
            border: none;
            padding: 0;
        }
        
        .icon-btn:hover {
            background: #e0e0e0;
        }
        
        .icon-btn svg {
            display: block;
        }
        
        .input-field {
            flex: 1;
            padding: 10px 14px;
            background: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            color: #333;
            min-width: 0;
        }
        
        .input-field::placeholder {
            color: #bbb;
        }
        
        .send-btn {
            padding: 8px 16px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
            white-space: nowrap;
            display: none;
            font-weight: 500;
        }
        
        .send-btn.show {
            display: block;
        }
        
        .send-btn:active {
            background: #06ad56;
        }
        
        .messages::-webkit-scrollbar {
            width: 4px;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 2px;
        }
        
        /* ========== 表情包弹窗 ========== */
        .emoji-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 999;
            animation: fadeIn 0.2s ease;
        }
        .emoji-overlay.active {
            display: flex;
        }
        .emoji-panel {
            background: #f7f7f7;
            width: 100%;
            max-width: 800px;
            border-radius: 16px 16px 0 0;
            padding: 20px 15px 30px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-height: 50vh;
            overflow-y: auto;
        }
        .emoji-overlay.active .emoji-panel {
            transform: translateY(0);
        }
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px 8px;
            margin-bottom: 16px;
        }
        .emoji-item {
            font-size: 32px;
            text-align: center;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .emoji-item:active {
            background: rgba(0,0,0,0.08);
            transform: scale(0.92);
        }
        .emoji-close-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #e8e8e8;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
        }
        .emoji-close-btn:active {
            background: #d0d0d0;
        }
        .emoji-panel .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            text-align: center;
        }
        
        /* ========== 加号弹窗 (More Panel) ========== */
        .more-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        .more-overlay.active {
            display: flex;
        }
        .more-panel {
            background: #f7f7f7;
            width: 100%;
            max-width: 800px;
            border-radius: 16px 16px 0 0;
            padding: 20px 15px 30px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-height: 70vh;
            overflow-y: auto;
        }
        .more-overlay.active .more-panel {
            transform: translateY(0);
        }
        .more-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 10px;
            margin-bottom: 20px;
        }
        .more-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 0;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .more-item:active {
            background: rgba(0,0,0,0.05);
        }
        .more-item .icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .more-item .icon svg {
            width: 32px;
            height: 32px;
            stroke: #333;
        }
        .more-item .label {
            font-size: 12px;
            color: #555;
            text-align: center;
        }
        .more-close-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #e8e8e8;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            margin-top: 4px;
        }
        .more-close-btn:active {
            background: #d0d0d0;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* 适配小屏 */
        @media (max-width: 420px) {
            .more-grid { gap: 12px 6px; }
            .more-item .icon { width: 48px; height: 48px; }
            .more-item .icon svg { width: 28px; height: 28px; }
            .emoji-grid { gap: 8px 4px; }
            .emoji-item { font-size: 26px; padding: 6px 2px; }
            .header-address { font-size: 11px; padding: 2px 8px; }
            .header-right { gap: 6px; }
            .chat-title { font-size: 14px; }
            .back-btn { font-size: 16px; width: 24px; height: 24px; }
            .toolbar-btn { font-size: 11px; padding: 3px 8px; }
        }
        
        @media (min-width: 768px) {
            body {
                max-width: 800px;
                margin: 0 auto;
                box-shadow: 0 0 30px rgba(0,0,0,0.1);
            }
            .msg-wrapper {
                max-width: 65%;
            }
            .more-panel, .emoji-panel {
                border-radius: 20px 20px 0 0;
            }
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <div class="header">
        <div class="header-left">
            <span class="back-btn">‹</span>
            <span class="chat-title" id="chatTitle">🚀 币圈社区 (719)</span>
        </div>
        <div class="header-right">
            <span class="header-address" id="headerAddress">0x12...34ab</span>
            <span class="header-more">⋯</span>
        </div>
    </div>
    
    <!-- 连接提示条 -->
    <div class="connect-banner" id="connectBanner">
        <div class="avatar">🦊</div>
        <div class="info">
            <div class="name">MetaMask 钱包</div>
            <div class="status" id="walletStatus">未连接</div>
        </div>
        <button class="connect-btn" id="connectBtn" onclick="connectWallet()">连接</button>
    </div>
    
    <!-- 消息区域 -->
    <div class="messages" id="messages">
        <div class="time-divider" id="timeDivider"></div>
        <div class="empty-state" id="emptyState">
            <div class="icon">💬</div>
            <p>暂无消息</p>
            <p>连接钱包后开始聊天</p>
        </div>
    </div>
    
    <!-- 输入框上方工具栏 -->
    <div class="toolbar">
        <button class="toolbar-btn meeting" onclick="handleEnterMeeting()">进入会议</button>
        <button class="toolbar-btn official" onclick="handleToolbarAction('查阅官网')">查阅官网</button>
        <button class="toolbar-btn notice" onclick="handleToolbarAction('官方通知')">官方通知</button>
        <button class="toolbar-btn economy" onclick="handleToolbarAction('经济模式')">经济模式</button>
        <button class="toolbar-btn token" onclick="handleTokenInfo()">代币信息</button>
    </div>
    
    <!-- 底部输入栏 - 微信布局 -->
    <div class="input-area">
        <!-- 语音按钮 -->
        <button class="icon-btn" onclick="toggleVoiceMode()" id="voiceBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10V12C5 15.866 8.134 19 12 19C15.866 19 19 15.866 19 12V10"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
        </button>
        
        <!-- 输入框 -->
        <input type="text" class="input-field" id="msgInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendMessage()">
        
        <!-- 表情按钮 - 触发表情包弹窗 -->
        <button class="icon-btn" onclick="toggleEmojiPanel()">😊</button>
        
        <!-- 加号按钮 - 触发弹窗 -->
        <button class="icon-btn" onclick="toggleMorePanel()" id="plusBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </button>
        
        <!-- 发送按钮 -->
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
    </div>

    <!-- 表情包弹窗 -->
    <div class="emoji-overlay" id="emojiOverlay" onclick="if(event.target===this) toggleEmojiPanel()">
        <div class="emoji-panel">
            <div class="panel-title">😊 表情包</div>
            <div class="emoji-grid" id="emojiGrid"></div>
            <button class="emoji-close-btn" onclick="toggleEmojiPanel()">取消</button>
        </div>
    </div>

    <!-- 加号弹窗 (More Panel) -->
    <div class="more-overlay" id="moreOverlay" onclick="if(event.target===this) toggleMorePanel()">
        <div class="more-panel">
            <div class="more-grid">
                <!-- 图片 -->
                <div class="more-item" onclick="handleMoreAction('图片')">
                    <div class="icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="2" ry="2"/>
                            <circle cx="9" cy="9" r="2"/>
                            <path d="M22 15l-5-5-6 6"/>
                        </svg>
                    </div>
                    <span class="label">图片</span>
                </div>
                <!-- 视频 -->
                <div class="more-item" onclick="handleMoreAction('视频')">
                    <div class="icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="3" ry="3"/>
                            <polygon points="9 7 17 12 9 17 9 7"/>
                        </svg>
                    </div>
                    <span class="label">视频</span>
                </div>
                <!-- 转账 -->
                <div class="more-item" onclick="handleMoreAction('转账')">
                    <div class="icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="5" width="20" height="14" rx="2"/>
                            <line x1="2" y1="10" x2="22" y2="10"/>
                            <circle cx="18" cy="14" r="1.5" fill="currentColor"/>
                            <polyline points="14 3 12 6 10 3"/>
                        </svg>
                    </div>
                    <span class="label">转账</span>
                </div>
                <!-- 代币红包 -->
                <div class="more-item" onclick="handleMoreAction('代币红包')">
                    <div class="icon">🧧</div>
                    <span class="label">代币红包</span>
                </div>
                <!-- 收藏 -->
                <div class="more-item" onclick="handleMoreAction('收藏')">
                    <div class="icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                    </div>
                    <span class="label">收藏</span>
                </div>
            </div>
            <button class="more-close-btn" onclick="toggleMorePanel()">取消</button>
        </div>
    </div>

    <script>
        let isConnected = false;
        let userAddress = '';
        let messageCount = 0;
        let isVoiceMode = false;
        
        // ===== 表情包数据 =====
        const emojiList = [
            '😀', '😁', '😂', '🤣', '😃', '😄', '😅',
            '😆', '😉', '😊', '😋', '😎', '😍', '🥰',
            '😘', '😗', '😙', '😚', '🥲', '😜', '🤪',
            '😝', '🤑', '🤗', '🤭', '🤫', '🤔', '🤐',
            '🤨', '😐', '😑', '😶', '😏', '😒', '🙄',
            '😬', '🤥', '😌', '😔', '😪', '🤤', '😴',
            '😷', '🤒', '🤕', '🤢', '🤮', '🥴', '😵',
            '🤯', '🥳', '🥺', '😡', '😠', '🤬', '😈',
            '💀', '☠️', '💩', '🤡', '👹', '👺', '👻',
            '💋', '💌', '💘', '💝', '💖', '💗', '💓',
            '💔', '❤️', '🧡', '💛', '💚', '💙', '💜',
            '🖤', '🤍', '🤎', '💕', '💞', '💯', '🔥',
            '⭐', '🌟', '✨', '💫', '🌈', '☀️', '🌙',
            '☁️', '⛅', '🌊', '🌸', '🌺', '🌻', '🌹',
            '🍀', '🌿', '☘️', '🍁', '🍂', '🍃', '🍄'
        ];
        
        // ----- 时间 & 在线人数 -----
        function setTime() {
            const now = new Date();
            document.getElementById('timeDivider').textContent = now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
        }
        setTime();
        setInterval(setTime, 30000);
        
        function updateOnlineCount() {
            // 已固定显示在标题中
        }
        updateOnlineCount();
        
        // ----- 钱包连接 -----
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    userAddress = accounts[0];
                    isConnected = true;
                    
                    document.getElementById('walletStatus').textContent = '✅ ' + userAddress.slice(0, 8) + '...' + userAddress.slice(-6);
                    document.getElementById('walletStatus').style.color = '#07c160';
                    document.getElementById('connectBtn').textContent = '已连接';
                    document.getElementById('connectBtn').style.background = '#ccc';
                    document.getElementById('connectBtn').disabled = true;
                    
                    const shortAddr = userAddress.slice(0, 4) + '...' + userAddress.slice(-4);
                    document.getElementById('headerAddress').textContent = shortAddr;
                    
                    if (messageCount === 0) {
                        const emptyState = document.getElementById('emptyState');
                        if (emptyState) emptyState.style.display = 'none';
                        addSystemMessage('🎉 欢迎来到币圈社区！');
                    }
                } catch (error) {
                    alert('连接失败：' + error.message);
                }
            } else {
                alert('请安装MetaMask钱包');
            }
        }
        
        // ----- 消息发送 -----
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            
            addOwnMessage(text, userAddress || '我');
            input.value = '';
            updateSendBtn();
            
            setTimeout(() => {
                const replies = ['收到！👍', '同意', '有道理', '关注一下', '好项目！', '学习了', '支持！', '已关注'];
                addOtherMessage(replies[Math.floor(Math.random() * replies.length)], '币圈助手');
            }, 800 + Math.random() * 2000);
        }
        
        function addOwnMessage(text, sender) {
            messageCount++;
            const messages = document.getElementById('messages');
            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.style.display = 'none';
            
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper own';
            let displaySender = '';
            if (sender && sender !== '我') {
                displaySender = sender.slice(0, 6) + '...' + sender.slice(-1);
            } else {
                displaySender = '我';
            }
            wrapper.innerHTML = `
                <div class="msg-avatar">我</div>
                <div class="msg-body">
                    <span class="msg-sender">${displaySender}</span>
                    <div class="msg-bubble">${text}</div>
                    <span class="msg-time">${getTime()}</span>
                </div>
            `;
            messages.appendChild(wrapper);
            scrollToBottom();
        }
        
        function addOtherMessage(text, sender) {
            messageCount++;
            const messages = document.getElementById('messages');
            
            let displaySender = '';
            if (sender && sender !== '币圈助手') {
                displaySender = sender.slice(0, 6) + '...' + sender.slice(-1);
            } else {
                displaySender = sender;
            }
            
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper other';
            wrapper.innerHTML = `
                <div class="msg-avatar">助</div>
                <div class="msg-body">
                    <span class="msg-sender">${displaySender}</span>
                    <div class="msg-bubble">${text}</div>
                    <span class="msg-time">${getTime()}</span>
                </div>
            `;
            messages.appendChild(wrapper);
            scrollToBottom();
        }
        
        function addSystemMessage(text) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'system-msg';
            div.textContent = text;
            messages.appendChild(div);
            scrollToBottom();
        }
        
        function getTime() {
            return new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
        }
        
        function scrollToBottom() {
            const messages = document.getElementById('messages');
            messages.scrollTop = messages.scrollHeight;
        }
        
        function updateSendBtn() {
            const input = document.getElementById('msgInput');
            const sendBtn = document.getElementById('sendBtn');
            if (input.value.trim()) {
                sendBtn.classList.add('show');
            } else {
                sendBtn.classList.remove('show');
            }
        }
        document.getElementById('msgInput').addEventListener('input', updateSendBtn);
        
        // ----- 语音模式切换 -----
        function toggleVoiceMode() {
            const input = document.getElementById('msgInput');
            const voiceBtn = document.getElementById('voiceBtn');
            isVoiceMode = !isVoiceMode;
            
            if (isVoiceMode) {
                input.placeholder = '按住说话';
                input.readOnly = true;
                input.style.background = '#e8e8e8';
                input.style.textAlign = 'center';
                voiceBtn.innerHTML = `
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="6" width="20" height="12" rx="2"/>
                        <line x1="6" y1="12" x2="6" y2="12"/>
                        <line x1="10" y1="12" x2="14" y2="12"/>
                        <line x1="18" y1="12" x2="18" y2="12"/>
                    </svg>
                `;
            } else {
                input.placeholder = '输入消息...';
                input.readOnly = false;
                input.style.background = 'white';
                input.style.textAlign = 'left';
                voiceBtn.innerHTML = `
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="2" width="6" height="12" rx="3"/>
                        <path d="M5 10V12C5 15.866 8.134 19 12 19C15.866 19 19 15.866 19 12V10"/>
                        <line x1="12" y1="19" x2="12" y2="22"/>
                    </svg>
                `;
            }
        }
        
        // ===== 表情包弹窗 =====
        function toggleEmojiPanel() {
            const overlay = document.getElementById('emojiOverlay');
            overlay.classList.toggle('active');
            if (overlay.classList.contains('active')) {
                renderEmojis();
            }
        }
        
        function renderEmojis() {
            const grid = document.getElementById('emojiGrid');
            if (grid.children.length > 0) return;
            emojiList.forEach(emoji => {
                const item = document.createElement('div');
                item.className = 'emoji-item';
                item.textContent = emoji;
                item.onclick = function(e) {
                    e.stopPropagation();
                    selectEmoji(emoji);
                };
                grid.appendChild(item);
            });
        }
        
        function selectEmoji(emoji) {
            toggleEmojiPanel();
            const input = document.getElementById('msgInput');
            input.value += emoji;
            updateSendBtn();
            input.focus();
        }
        
        // ===== 加号弹窗 =====
        function toggleMorePanel() {
            const overlay = document.getElementById('moreOverlay');
            overlay.classList.toggle('active');
        }
        
        function handleMoreAction(action) {
            toggleMorePanel();
            addSystemMessage(`📌 发起「${action}」功能 (演示)`);
            setTimeout(() => {
                const replies = [
                    `支持 ${action}！`, 
                    `我也要参与 ${action}`, 
                    `${action} 功能不错`, 
                    `已收到 ${action} 请求`
                ];
                addOtherMessage(replies[Math.floor(Math.random() * replies.length)], '币圈助手');
            }, 500 + Math.random() * 1000);
        }
        
        // ===== 工具栏按钮 =====
        function handleEnterMeeting() {
            addSystemMessage('📞 正在进入会议...');
            setTimeout(() => {
                addSystemMessage('✅ 已加入会议，当前参会人数 12 人');
                addOtherMessage('欢迎加入会议！', '会议主持人');
            }, 800);
        }
        
        function handleToolbarAction(action) {
            addSystemMessage(`📌 ${action} - 功能开发中`);
            setTimeout(() => {
                const replies = [
                    `已收到 ${action} 请求`, 
                    `${action} 功能即将上线`, 
                    `感谢关注 ${action}`
                ];
                addOtherMessage(replies[Math.floor(Math.random() * replies.length)], '币圈助手');
            }, 500 + Math.random() * 800);
        }
        
        function handleTokenInfo() {
            addSystemMessage('📊 正在加载代币信息...');
            setTimeout(() => {
                addSystemMessage('💰 BTC: $67,832 | ETH: $3,521 | SOL: $189.7');
                addSystemMessage('📈 24h 涨跌: BTC +2.3% | ETH +1.8% | SOL +5.6%');
                addOtherMessage('当前市场整体偏多，建议关注ETH走势', '币圈助手');
            }, 800);
        }
        
        document.getElementById('chatTitle').textContent = '🚀 币圈社区 (719)';
    </script>
</body>
</html>
